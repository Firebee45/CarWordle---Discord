<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarWordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>CarWordle</h1>
            <p>Guess Make, Model, and Year in 5 tries</p>
        </header>

        <div class="game-card">
            <div class="image-container">
                <img id="carImage" src="" alt="Mystery Car">
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="makeSelect">Make</label>
                    <select id="makeSelect">
                        <option value="">-- Make --</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="modelSelect">Model</label>
                    <select id="modelSelect">
                        <option value="">-- Model --</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="yearInput">Year</label>
                    <input type="text" id="yearInput" placeholder="e.g. 2018" maxlength="4">
                </div>
            </div>

            <button id="submitBtn" class="btn">Submit Guess</button>

            <div class="history-section">
                <label>Attempt Board</label>
                <div class="history-grid" id="historyGrid"></div>
            </div>

            <div id="messageBox" class="message-box">
                <div id="messageText"></div>
                <div id="answerReveal" class="answer-reveal"></div>
            </div>
        </div>
    </div>

    <script src="dataset.js"></script>
    <script src="script.js"></script>
</body>
</html>
